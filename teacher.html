function ed(id){const s=ST.find(x=>x.id==id),n=prompt('اسم الطالب',s.name);if(!n)return;const p=prompt('رقم الهاتف',s.phone),g=prompt('الصف ('+GR.join('، ')+')',s.grade),c=prompt('الشعبة ('+SEC.join('، ')+')',s.section);
S().doc(id).update({name:n,phone:p||s.phone,grade:GR.includes(g)?g:s.grade,section:SEC.includes(c)?c:s.section})}
function fl(v){v=v.trim();$('ls').innerHTML=`<p>العدد: ${ST.length}</p>`+(ST.filter(s=>(s.name+s.phone+s.parent+s.id).includes(v)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(s=>`<div class="card"><img class="ph" src="${s.photo||''}"> <b>${s.name}</b> — ${s.grade}/${s.section}<br>ولي الأمر: ${s.parent} — ${s.phone}<br>الرمز: <b>${s.id}</b> <button onclick="ed('${s.id}')">✏️</button><button onclick="mv('${s.id}')">🔀</button><button onclick="del('${s.id}')">🗑</button><button onclick="lk('${s.id}',${!s.lock})">${s.lock?'🔓 فتح':'🔒 قفل'}</button><button onclick="ck('${s.id}')">🔑 الرمز</button></div>`).join('')||'<p>لا نتائج</p>')}
function del(id){confirm('حذف الطالب نهائياً؟')&&S().doc(id).delete()}
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('it').value=r.result;r.readAsText(f,'utf-8')}
async function imp(){const g=C.g,s=C.s,rows=$('it').value.split('\n').map(l=>l.split(/[,\t،;]/).map(x=>x.trim())).filter(r=>r[0]);if(!rows.length)return alert('اكتب الأسماء أولاً');
const have=new Set(ST.filter(x=>x.grade==g&&x.section==s).map(x=>x.name)),codes=new Set(ST.map(x=>x.id)),out=[];let sk=0;
const nc=()=>{let c;do{c=String(Math.floor(1e6+Math.random()*9e6))}while(codes.has(c));codes.add(c);return c};
for(const r of rows){if(have.has(r[0])){sk++;continue}have.add(r[0]);out.push({id:nc(),name:r[0],parent:r[1]||'',phone:r[2]||'',grade:g,section:s,photo:'',g:{},b:{},abs:[],warn:[],obj:[],created:Date.now()})}
try{for(let i=0;i<out.length;i+=400){const b=db.batch();out.slice(i,i+400).forEach(({id,...d})=>b.set(S().doc(id),d));await b.commit()}}catch(e){return alert('تعذر الاستيراد: '+e.message)}
IR=`<div class="card"><b>تم استيراد ${out.length} طالب إلى الصف ${g} / ${s}${sk?` (تخطي ${sk} مكرر)`:''}</b><br><button onclick="print()">🖨 طباعة الرموز</button><table>`+out.map(x=>`<tr><td>${x.name}</td><td><b>${x.id}</b></td></tr>`).join('')+'</table></div>';draw()}
function mv(id){const s=ST.find(x=>x.id==id);$('md').innerHTML=`<div class="card"><h3>نقل: ${s.name}</h3><select id="mg">${opt(GR,s.grade)}</select><select id="ms">${opt(SEC,s.section)}</select><button class="pri" onclick="mvgo('${id}')">نقل</button> <button onclick="$('md').hidden=true">إلغاء</button></div>`;$('md').hidden=false}
function mvgo(id){S().doc(id).update({grade:$('mg').value,section:$('ms').value}).then(()=>$('md').hidden=true)}
let CF={};
function ap(){try{const[a,g]=JSON.parse(localStorage.th);document.documentElement.style.setProperty('--a',a);document.documentElement.style.setProperty('--g',g)}catch(e){}}ap();
function th(a,g){localStorage.th=JSON.stringify([a,g]);ap()}
const cfg=o=>db.collection('pub').doc('_cfg').set(o,{merge:true});
function sendN(){const t=$('nh').value.trim(),b=$('nb').value.trim();if(!t||!b)return alert('اكتب العنوان والنص');db.collection('pub').doc('_notice').set({id:Date.now(),to:$('nt').value,title:t,text:b}).then(()=>alert('تم الإرسال 🚀'))}
function sup(){const t=$('sm').value.trim();if(!t)return;db.collection('support').add({from:me.name,text:t,ts:Date.now()}).then(()=>{$('sm').value='';alert('وصلت رسالتك للمطورين ✅')}).catch(()=>alert('تعذر الإرسال'))}
function notice(n){if(isM||n.to=='parents'||localStorage['nid_'+MODE]==n.id)return;localStorage['nid_'+MODE]=n.id;pop('🔔','var(--a)',n.title,n.text,[200])}
function te(id){const t=TC.find(x=>x.id==id),n=prompt('الاسم',t.name);if(!n)return;const sb=prompt('المادة',t.subject),g=prompt('الصف ('+GR.join('، ')+')',t.grade),c=prompt('الشعبة ('+SEC.join('، ')+')',t.section);db.collection('teachers').doc(id).update({name:n,subject:sb||t.subject,grade:GR.includes(g)?g:t.grade,section:SEC.includes(c)?c:t.section})}
const lk=(id,v)=>S().doc(id).update({lock:v});
async function ck(id){const n=(prompt('الرمز الجديد (أرقام، 4 فأكثر)')||'').trim();if(!/^\d{4,}$/.test(n))return;if((await S().doc(n).get()).exists)return alert('الرمز مستخدم');const d={...ST.find(x=>x.id==id)};delete d.id;await S().doc(n).set(d);await S().doc(id).delete()}
function pop(i,col,t,m,v){navigator.vibrate&&navigator.vibrate(v);const d=document.createElement('div');d.className='pop';d.style.setProperty('--p',col);d.innerHTML=`<div><div class="big">${i}</div><h2>${t}</h2><p>${m}</p><button class="pri" onclick="this.closest('.pop').remove()">حسناً</button></div>`;document.body.appendChild(d)}
const TG=['مشاغب','لا يشارك بالدرس','كثير الكلام','غير منتبه','لا يحل الواجب','متأخر عن الحصة','متعاون','مشارك ونشيط','ملتزم بالهدوء','مجتهد'];
const bs=b=>!b?'⭐ تقييم':typeof b=='string'?b:(b.r||'تقييم')+((b.t||[]).length?' +'+b.t.length:'')+(b.m?' 💬':'');
function bh(id){const s=ST.find(x=>x.id==id),b=(s.b||{})[C.sub.replace(/\./g,'')]||{},t=b.t||[];
$('md').innerHTML=`<div class="card"><h3>سلوك: ${s.name}</h3><select id="br"><option value="">التقييم العام</option>${opt(BH,typeof b=='string'?b:b.r)}</select><div class="tg">${TG.map(x=>`<label><input type="checkbox" value="${x}" ${t.includes(x)?'checked':''}>${x}</label>`).join('')}</div><textarea id="bm" rows="3" style="width:100%" placeholder="رسالة لولي الأمر (اختياري)">${b.m||''}</textarea><button class="pri" onclick="bsv('${id}')">حفظ</button> <button onclick="$('md').hidden=true">إلغاء</button></div>`;$('md').hidden=false}
function bsv(id){S().doc(id).update({[`b.${C.sub.replace(/\./g,'')}`]:{r:$('br').value,m:$('bm').value.trim(),t:[...document.querySelectorAll('.tg input:checked')].map(x=>x.value)}}).then(()=>$('md').hidden=true)}
const pub=(k,v)=>db.collection('pub').doc(k).set({sent:v});
function pubAll(v){const b=db.batch();GR.forEach(g=>SEC.forEach(s=>b.set(db.collection('pub').doc(g+'-'+s),{sent:!!v})));b.commit()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('ib2').hidden=false;$('ih').hidden=true});$('ib2').onclick=()=>dp.prompt();
$('ih').innerHTML=/iphone|ipad/i.test(navigator.userAgent)?'آيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»':'من قائمة المتصفح ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»';
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدرسة نهج البلاغة الأهلية - الإدارة</title><link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#0b2a5b"><link rel="icon" href="logo.png">
<style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f1e8;color:#222}header{background:#0b2a5b;color:#fff;text-align:center;padding:10px}header img{height:80px}h1{font-size:18px;margin:4px 0;color:#f0c94a}main{max-width:820px;margin:auto;padding:10px}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0002}input,select,textarea,button{font:inherit;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;max-width:100%}input,select{width:100%}button{background:#fff;cursor:pointer}.pri,.on{background:#0b2a5b;color:#fff;border:0}table{width:100%;border-collapse:collapse;background:#fff}td{padding:6px;border-bottom:1px solid #eee;vertical-align:middle}td input,td select{min-width:75px}.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#ddd}#tabs{display:flex;gap:4px;overflow-x:auto}#tabs button{white-space:nowrap}.bar{display:flex;gap:6px}.gp{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}footer{text-align:center;font-size:12px;padding:14px;color:#666}</style></head><body>
<header><img src="logo.png" alt=""><h1>مدرسة نهج البلاغة الأهلية</h1><small>الإدارة والمدرسون</small></header>
<main>
<div id="lg" class="card"><h3>تسجيل الدخول</h3><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور"><button class="pri" onclick="au.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(()=>alert('بيانات الدخول خاطئة'))">دخول</button><br><a href="#" onclick="show('rg');return false">تسجيل مدرس جديد</a></div>
<div id="rg" class="card" hidden><h3>تسجيل مدرس</h3><input id="rn" placeholder="الاسم"><input id="rs" placeholder="المادة التي تدرسها"><select id="rgd"></select><select id="rsc"></select><input id="re" type="email" placeholder="البريد الإلكتروني"><input id="rp" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)"><button class="pri" onclick="reg()">تسجيل</button> <button onclick="show('lg')">رجوع</button></div>
<div id="wt" class="card" hidden><h3>تم التسجيل ✅</h3><p>بانتظار موافقة المدير على حسابك.</p><button onclick="au.signOut()">خروج</button></div>
<div id="app" hidden><div id="tabs"></div><div id="body"></div><button onclick="au.signOut()">خروج</button></div>
<button id="ins" hidden>📲 تثبيت التطبيق</button>
</main><footer>تصميم وبرمجة: علي محمد دينار</footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyB_BG0mnIJqg60jXMHwFAUti6Z5RgzWfOE",authDomain:"nahj-albalagha-school-3953a.firebaseapp.com",projectId:"nahj-albalagha-school-3953a",appId:"1:468446864487:web:2244cb6e4ef9385297a0c2"},ADMIN='a7qubd85hw5r@gmail.com';
const GR=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'],SEC=['أ','ب','ج','د','هـ'],BH=['ممتاز','جيد جداً','جيد','مقبول','ضعيف'];
const F={m1:'الشهر الأول',m2:'الشهر الثاني',m3:'الشهر الثالث',h1:'معدل النصف الأول',mid:'نصف السنة',h2:'معدل النصف الثاني',sa:'السعي السنوي',ex:'الامتحان النهائي',fin:'الدرجة النهائية'};
if(typeof firebase=='undefined'){document.body.innerHTML='<h3 style="padding:20px;text-align:center">⚠️ افتح الصفحة من رابط الاستضافة بمتصفح Chrome، وليس من داخل المعاينة</h3>';throw 0}
firebase.initializeApp(FB);const db=firebase.firestore(),au=firebase.auth(),$=id=>document.getElementById(id),S=()=>db.collection('students');
let me,isM,ST=[],TC=[],PB={},tab='g',C={g:GR[0],s:SEC[0],sub:'',f:'m1'},dp;
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
$('rgd').innerHTML=opt(GR);$('rsc').innerHTML=opt(SEC);
function show(id){['lg','rg','wt','app'].forEach(x=>$(x).hidden=x!=id)}
au.onAuthStateChanged(async u=>{if(!u)return show('lg');isM=u.email==ADMIN;
if(isM)me={name:'المدير'};else{const d=await db.collection('teachers').doc(u.uid).get();if(!d.exists)return show('lg');me=d.data();if(!me.ok)return show('wt');C={g:me.grade,s:me.section,sub:me.subject,f:'m1'}}
show('app');start()});
async function reg(){const v=i=>$(i).value.trim();if(!v('rn')||!v('rs')||!v('re')||$('rp').value.length<6)return alert('أكمل الحقول');
try{const u=await au.createUserWithEmailAndPassword(v('re'),$('rp').value);await db.collection('teachers').doc(u.user.uid).set({name:v('rn'),subject:v('rs'),grade:$('rgd').value,section:$('rsc').value,ok:false});location.reload()}catch(e){alert('تعذر التسجيل: '+e.message)}}
function start(){let q=S();if(!isM)q=q.where('grade','==',C.g).where('section','==',C.s);
q.onSnapshot(s=>{ST=s.docs.map(d=>({id:d.id,...d.data()}));live()});
if(isM)db.collection('teachers').onSnapshot(s=>{TC=s.docs.map(d=>({id:d.id,...d.data()}));live()});
db.collection('pub').onSnapshot(s=>{PB={};s.forEach(d=>PB[d.id]=d.data().sent);live()})}
function live(){if(document.activeElement.tagName!='INPUT')draw()}
function sel(){return isM?`<div class="bar"><select onchange="C.g=this.value;draw()">${opt(GR,C.g)}</select><select onchange="C.s=this.value;draw()">${opt(SEC,C.s)}</select><input placeholder="المادة" value="${C.sub}" onchange="C.sub=this.value.trim();draw()"></div>`:`<p><b>${me.name}</b> — ${me.subject} — الصف ${C.g} شعبة ${C.s}</p>`}
function draw(){if(!me)return;const T={g:'الدرجات',a:'الغيابات والإنذارات',o:'الاعتراضات'};if(isM){T.l='قائمة الطلاب';T.p='إرسال الدرجات';T.t='المعلمون'}
$('tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${v}</button>`).join('');
const L=ST.filter(s=>s.grade==C.g&&s.section==C.s).sort((a,b)=>a.name.localeCompare(b.name,'ar')),sb=C.sub.replace(/\./g,'');let h='';
if(tab=='g'){h=sel()+`<select onchange="C.f=this.value;draw()">${Object.entries(F).map(([k,v])=>`<option value="${k}" ${k==C.f?'selected':''}>${v}</option>`).join('')}</select>`;
if(!sb)h+='<p>اكتب اسم المادة</p>';else if(!L.length)h+='<p>لا يوجد طلاب في هذه الشعبة بعد</p>';else h+='<table>'+L.map(s=>`<tr data-id="${s.id}"><td><img class="ph" src="${s.photo||''}"></td><td>${s.name}</td><td><input type="number" step="any" value="${((s.g||{})[sb]||{})[C.f]??''}"></td><td><select><option value="">السلوك</option>${opt(BH,(s.b||{})[sb])}</select></td>${isM?`<td><button onclick="ed('${s.id}')">✏️</button><button onclick="del('${s.id}')">🗑</button></td>`:''}</tr>`).join('')+'</table><button class="pri" onclick="save()">💾 حفظ</button>'}
if(tab=='a')h=sel()+'<table>'+L.map(s=>`<tr><td><img class="ph" src="${s.photo||''}"></td><td>${s.name}</td>${['abs','warn'].map(k=>`<td>${k=='abs'?'غياب':'إنذار'} ${(s[k]||[]).length}<br><button onclick="ch('${s.id}','${k}',1)">＋</button><button onclick="ch('${s.id}','${k}',0)">－</button></td>`).join('')}</tr>`).join('')+'</table>';
if(tab=='o'){const O=[];ST.forEach(s=>(s.obj||[]).forEach((o,i)=>{if(isM||o.s==me.subject)O.push([s,o,i])}));
h=O.map(([s,o,i])=>`<div class="card"><b>${s.name}</b> (${s.grade}/${s.section}) — ${o.s}<br>${o.t}<br><input id="r${s.id}_${i}" value="${o.r||''}" placeholder="الرد"><button onclick="rep('${s.id}',${i})">إرسال الرد</button></div>`).join('')||'<p>لا توجد اعتراضات</p>'}
if(tab=='p')h='<button class="pri" onclick="pubAll(1)">إرسال الدرجات لجميع الصفوف</button> <button onclick="pubAll(0)">إيقاف الكل</button><div class="gp">'+GR.flatMap(g=>SEC.map(s=>{const k=g+'-'+s,on=PB[k];return `<button class="${on?'on':''}" onclick="pub('${k}',${!on})">${g} ${s} ${on?'✅':'⏸'}</button>`})).join('')+'</div>';
if(tab=='t')h=TC.map(t=>`<div class="card"><b>${t.name}</b> — ${t.subject} — ${t.grade}/${t.section}<br><button onclick="db.collection('teachers').doc('${t.id}').update({ok:${!t.ok}})">${t.ok?'إيقاف الحساب':'قبول ✅'}</button><button onclick="confirm('حذف؟')&&db.collection('teachers').doc('${t.id}').delete()">حذف</button></div>`).join('')||'<p>لا يوجد معلمون</p>';
if(tab=='l')h='<input placeholder="بحث بالاسم أو الهاتف أو الرمز" oninput="fl(this.value)"><div id="ls"></div>';
$('body').innerHTML=h;if(tab=='l')fl('')}
async function save(){const sb=C.sub.replace(/\./g,''),b=db.batch();document.querySelectorAll('tr[data-id]').forEach(r=>{const i=r.querySelector('input'),s=r.querySelector('select'),u={};if(i.value!=='')u[`g.${sb}.${C.f}`]=Number(i.value);if(s.value)u[`b.${sb}`]=s.value;if(Object.keys(u).length)b.update(S().doc(r.dataset.id),u)});
try{await b.commit();alert('تم الحفظ ✅')}catch(e){alert('تعذر الحفظ')}}
function ch(id,k,add){const a=[...(ST.find(x=>x.id==id)[k]||[])];if(add){const t=k=='warn'?prompt('سبب الإنذار'):'';if(t===null)return;a.push({d:new Date().toLocaleDateString('ar-IQ'),t})}else a.pop();S().doc(id).update({[k]:a})}
function rep(id,i){const a=[...ST.find(x=>x.id==id).obj];a[i]={...a[i],r:$(`r${id}_${i}`).value};S().doc(id).update({obj:a}).then(()=>alert('تم الرد'))}
function ed(id){const s=ST.find(x=>x.id==id),n=prompt('اسم الطالب',s.name);if(!n)return;const p=prompt('رقم الهاتف',s.phone),g=prompt('الصف ('+GR.join('، ')+')',s.grade),c=prompt('الشعبة ('+SEC.join('، ')+')',s.section);
S().doc(id).update({name:n,phone:p||s.phone,grade:GR.includes(g)?g:s.grade,section:SEC.includes(c)?c:s.section})}
function fl(v){v=v.trim();$('ls').innerHTML=`<p>العدد: ${ST.length}</p>`+(ST.filter(s=>(s.name+s.phone+s.parent+s.id).includes(v)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(s=>`<div class="card"><img class="ph" src="${s.photo||''}"> <b>${s.name}</b> — ${s.grade}/${s.section}<br>ولي الأمر: ${s.parent} — ${s.phone}<br>الرمز: <b>${s.id}</b> <button onclick="ed('${s.id}')">✏️</button><button onclick="del('${s.id}')">🗑</button></div>`).join('')||'<p>لا نتائج</p>')}
function del(id){confirm('حذف الطالب نهائياً؟')&&S().doc(id).delete()}
const pub=(k,v)=>db.collection('pub').doc(k).set({sent:v});
function pubAll(v){const b=db.batch();GR.forEach(g=>SEC.forEach(s=>b.set(db.collection('pub').doc(g+'-'+s),{sent:!!v})));b.commit()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('ins').hidden=false});$('ins').onclick=()=>dp.prompt();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
